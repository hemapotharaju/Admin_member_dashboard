{% extends 'dashboard/base.html' %}

{% block title %}Signup - Admin Dashboard{% endblock %}

{% block body_id %}signup-page{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Signup</h1>
    <form id="signup-form">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Email</label>
        <input type="email" name="email">
        <label>Password</label>
        <input type="password" name="password" required>
        <label>Role</label>
        <select name="role">
            <option value="Member">Member</option>
            <option value="Admin">Admin</option>
        </select>
        <button type="submit">Create account</button>
    </form>
    <p class="form-note">Already registered? <a href="/login/">Login</a></p>
    <div class="status-message" id="signup-message"></div>
</div>
{% endblock %}
